<script type="text/html" data-help-name="wattery">
  <p>Lokální spojení Victron GX s <b>wattery</b> — data jdou přímo z Cerba místo přes VRM.</p>
  <h3>Nastavení</h3>
  <ol>
    <li>V aplikaci wattery: <b>Nastavení → Lokální spojení → Spárovat zařízení</b>. Kód platí 15 minut.</li>
    <li>Vložte kód sem, klikněte <b>Done</b> a pak <b>Deploy</b>. Pod uzlem se ukáže stav, zelené
      <i>čte · čas</i> = vše v pořádku.</li>
  </ol>
  <p>Ostatní pole nechte, jak jsou. Uzel čte broker MQTT Cerba na <code>localhost</code> (heslo není potřeba).</p>
  <h3>Řízení z wattery</h3>
  <p>Ve výchozím stavu je vypnuté a uzel <b>do Cerba nic nezapisuje</b>. Zapněte ho, jen když se tak domluvíte
     s wattery. Pak uzel zapisuje jen rozvrh Dynamic ESS, minimální SOC baterie a nabíječku EV, v mezích, které
     má zabudované, a po každém zápisu ověří hodnotu v Cerbu. Když se se serverem wattery dlouho nespojí, sám vypne
     Dynamic ESS a Cerbo jede podle vašeho nastavení ESS. Vypnutím (a Deploy) uzel okamžitě přestane zapisovat;
     rozvrh, který už v Cerbu je, doběhne.</p>
  <p>Odpojit jde v aplikaci wattery (✕) nebo smazáním uzlu a Deploy.</p>
  <p><a href="https://spot.wattery.cz/navody/pripojeni-victron-cerbo" target="_blank" rel="noopener">Návod s obrázky</a></p>
</script>
