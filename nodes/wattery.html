<script type="text/javascript">
  RED.nodes.registerType('wattery', {
    category: 'wattery',
    color: '#5fb8a0',
    defaults: {
      name: { value: '' },
      server: { value: 'https://monitoring.wattery.cz', required: true },
      host: { value: '127.0.0.1', required: true },
      port: { value: 1883, required: true, validate: RED.validators.number() },
      kind: { value: 'nodered' }
    },
    credentials: { code: { type: 'password' } },
    inputs: 0,
    outputs: 0,
    icon: 'bridge.svg',
    label: function () { return this.name || 'wattery'; },
    paletteLabel: 'wattery'
  });
</script>

<script type="text/html" data-template-name="wattery">
  <div class="form-row">
    <label for="node-input-code"><i class="fa fa-key"></i> Párovací kód</label>
    <input type="password" id="node-input-code" placeholder="ABCD-EFGH">
  </div>
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Název</label>
    <input type="text" id="node-input-name" placeholder="wattery">
  </div>
  <div class="form-row">
    <label for="node-input-server"><i class="fa fa-cloud"></i> Server</label>
    <input type="text" id="node-input-server">
  </div>
  <div class="form-row">
    <label for="node-input-host"><i class="fa fa-server"></i> GX MQTT</label>
    <input type="text" id="node-input-host" style="width: 50%">
    <input type="text" id="node-input-port" style="width: 20%">
  </div>
</script>

<script type="text/html" data-help-name="wattery">
  <p>Lokální spojení Victron GX s <b>wattery</b> — data jdou přímo z Cerba místo přes VRM.</p>
  <h3>Nastavení</h3>
  <ol>
    <li>V aplikaci wattery u elektrárny zvolte „Připojit lokálně“ a opište párovací kód.</li>
    <li>Vložte kód sem a klikněte na <b>Nasadit</b>. Pod uzlem se ukáže stav.</li>
  </ol>
  <p>Ostatní pole nechte, jak jsou. Uzel čte broker MQTT Cerba na <code>localhost</code> (heslo není potřeba)
     a <b>do Cerba nic nezapisuje</b>. Odpojit jde v aplikaci wattery nebo smazáním uzlu.</p>
</script>
